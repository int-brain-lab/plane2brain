[project]
name = "plane2brain"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "International Brain Laboratory", email = "software-devs@internationalbrainlab.org"},
]
dependencies = []
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.ruff]
exclude = [
    "src/scripts",
]

[tool.ruff.lint]
ignore = ["E741"]

[dependency-groups]
lint = ["ruff>=0.7.3"]
